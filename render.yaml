services:
  - type: cron
    name: tambul-monthly-contributions-v2
    runtime: python
    schedule: "5 0 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py generate_monthly_contributions"

  - type: cron
    name: tambul-loan-reminders
    runtime: python
    schedule: "0 6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_due_loan_reminders"

  - type: cron
    name: tambul-weekly-committee-summary
    runtime: python
    schedule: "0 6 * * 1"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_weekly_committee_summary --days 7"

  - type: cron
    name: tambul-daily-reminder-backfill
    runtime: python
    schedule: "30 6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_due_loan_reminders --backfill-days 1"
