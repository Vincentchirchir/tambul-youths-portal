<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Updated | Tambul Hustle Youth Group</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: "Inter", Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #020617;
      padding: 26px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.45);
    }

    img {
      width: 60px;
      margin-bottom: 14px;
    }

    h2 {
      margin-bottom: 8px;
    }

    p {
      color: #9ca3af;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="{% static 'images/logo.png' %}" alt="Tambul Hustle Logo">
    <h2>Password Updated</h2>
    <p>Your password has been changed successfully.</p>

    <a href="{% url 'profile' %}">
      Back to My Profile
    </a>
  </div>

</body>
</html>
